# ============================================================
# CI 工作流：提交/PR 时自动编译 + 测试
# 触发条件：push 到 dev/master，或发起 Pull Request
# ============================================================
name: CI

on:
  push:
    branches:
      - dev
      - master
  pull_request:
    branches:
      - dev
      - master

jobs:
  build-and-test:
    name: Build & Test (JDK 17)
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装 JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'       # Eclipse Temurin，可换 corretto / zulu
          cache: 'maven'                # 自动缓存 ~/.m2，加速后续构建

      # 3. 编译 & 测试
      #    如果你的测试依赖 MySQL/Redis/Nacos，请：
      #    - 在 services 中启动对应的 Docker 容器
      #    - 或暂时跳过集成测试：-DskipTests
      #    - 或用 test profile 连接 mock 服务
      - name: Build with Maven
        run: ./mvnw clean package -B
        # run: ./mvnw clean package -B -DskipTests   # 暂时跳过测试
